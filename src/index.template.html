<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9dccd0">
<title>滴水成林 · 校园小鱼塘</title>
<style>/* INLINE_STYLE */</style>
</head>
<body>
<main id="app">
  <canvas id="water" aria-hidden="true"></canvas>
  <div id="fish-world"><button id="pet" aria-label="和小鱼打招呼"><img id="pet-image" alt=""><span id="fish-speech" hidden></span></button></div>
  <div id="floating-reward" aria-live="polite" hidden></div>
  <div id="interface">
    <header class="topbar">
      <div class="hud">
        <button class="pill" data-open="records"><b id="points">80</b><span class="coin">✦</span><span class="plus">+</span><span class="sr-only" data-t="greenPoints"></span></button>
        <button class="pill" data-open="food"><b id="food">3</b><span data-icon="food"></span><span class="plus">+</span><span class="sr-only" data-t="food"></span></button>
        <button class="pill tank-pill" data-open="campus"><span data-icon="tree"></span><span data-t="campusPond"></span><b class="level-label" id="level">Lv. 1</b></button>
      </div>
      <div class="carebar">
        <button id="feed" class="care"><span data-icon="food"></span><b data-t="feed"></b><small id="feed-sub"></small></button>
        <button class="care care-small" data-open="wardrobe"><span class="icon-ring" data-icon="shirt"></span><b data-t="dress"></b></button>
        <button class="care" data-open="friends"><span data-icon="group"></span><b data-t="together"></b><small id="friend-sub"></small></button>
        <button id="collect" class="care collect"><b data-t="collect"></b><small id="collect-sub"></small></button>
      </div>
    </header>
    <div class="corner-controls"><button id="language" class="mini-pill" aria-label="Switch to English">EN</button><button id="sound" class="mini-pill" aria-label="关闭音效"></button></div>
    <div class="world-label"><b data-t="brand"></b><span data-t="localDemo"></span></div>
    <nav class="dock" aria-label="游戏导航">
      <button id="next-goal" class="next-goal"><span><b id="goal-title"></b><i class="goal-track"><i id="goal-progress"></i></i></span><span id="goal-reward"></span><span data-icon="chevron"></span></button>
      <div class="nav-items">
        <button data-tab="home" class="nav-item active" aria-current="page"><span data-icon="tank"></span><b data-t="aquarium"></b><small id="fish-count"></small></button>
        <button data-tab="games" class="nav-item"><span data-icon="game"></span><b data-t="challenges"></b><small id="game-count"></small></button>
        <button data-tab="bag" class="nav-item"><span data-icon="bag"></span><b data-t="inventory"></b><small id="bag-count"></small></button>
        <button data-tab="campus" class="nav-item"><span data-icon="tree"></span><b data-t="guardian"></b><small id="guardian-sub"></small></button>
        <button data-tab="profile" class="nav-item"><span data-icon="user"></span><b data-t="you"></b><small id="profile-level"></small></button>
      </div>
    </nav>
  </div>
  <div id="welcome" class="welcome">
    <section class="welcome-card" aria-labelledby="welcome-title">
      <img id="welcome-fish" alt="">
      <h1 id="welcome-title" data-t="brand"></h1>
      <p data-t="welcomeCopy"></p>
      <button id="play" class="play"><span data-icon="play"></span><span data-t="play"></span></button>
      <small data-t="welcomeFoot"></small>
    </section>
  </div>
  <div id="overlay" class="overlay" hidden>
    <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
      <div class="sheet-grip" aria-hidden="true"></div>
      <header class="sheet-header"><h2 id="sheet-title"></h2><button id="close-sheet" class="round-close" aria-label="关闭">×</button></header>
      <div id="sheet-body" class="sheet-body"></div>
    </section>
  </div>
  <canvas id="fireworks" aria-hidden="true"></canvas>
  <div id="toast" class="toast" role="status" hidden></div>
</main>
<script id="assets" type="application/json">/* INLINE_ASSETS */</script>
<script>/* INLINE_CORE */</script>
<script>/* INLINE_SCENERY */</script>
<script>/* INLINE_APP */</script>
</body>
</html>
